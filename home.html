<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home Page</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    />
    <link rel="stylesheet" href="home.css" />
    <link rel="stylesheet" href="theme.css" />
  </head>
  <body>
    <header>
      <div class="logo-text">
        <p>CONNECT <span>4</span></p>
      </div>
      <div class="settings-icon">
        <i
          class="fa-solid fa-gear fa-spin"
          style="color: var(--color-text-secondary)"
        ></i>
      </div>
    </header>
    <main>
      <div class="game-img">
        <img src="assets/7a65e06b-532d-4488-bbc2-abcef5c2a40e.png" />
        <h1 class="game-title">CONNECT FOUR</h1>
      </div>
      <div class="game-content">
        <p>
          The classic stagergy game of vertical checkers. Be the first to connet
          four discs in a row, column, or diagonal
        </p>
        <p>
          <button class="play">Play Game</button>
          <button class="settings">Settings</button>
        </p>
      </div>
    </main>
    <footer>
      <div class="Select-theme">Selected Theme</div>
      <div class="theme-box">Classic Blue</div>
    </footer>
  </body>
</html>
