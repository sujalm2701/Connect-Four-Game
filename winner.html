<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Winner-Page</title>
    <link rel="stylesheet" href="game.css">
</head>
<body>
    <div class="winner-logo">
        <!-- <img src="WIN.jpeg"> -->
    </div>
    <div class="win-statment">
        <p>PLAYER 1</p> 
        <span>WINS</span>
    </div>
    <div class="match-comp">Match Complete</div>
    <div class="time-moveout">
        <div class="time">
            <p>DURATION</p>
            <p class="moves">04.12</p>
        </div>
        <div class="time">
            <p>TOTAL MOVES</p>
            <p class="moves">28</p>
        </div>        
    </div>
    <div class="again">
        <div class="logo-again">
            Play Again
        </div>
    </div>
    <div class="next-match">
        <div>
            <div class="add">
                New Match
            </div>
        </div>
         <div>
            <div class="add">
                Home
            </div>
        </div>
    </div>
</body>
</html>
